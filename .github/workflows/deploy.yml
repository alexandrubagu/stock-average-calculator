name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel a deployment that is in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Provides the Pages URL (including a custom domain, if one is configured).
      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      # Pull requests build with the default URL from site.config.ts.
      - name: Resolve the site URL
        id: site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: echo "url=${PAGES_BASE_URL:+$PAGES_BASE_URL/}" >> "$GITHUB_OUTPUT"

      - name: Lint and type-check
        run: |
          npm run lint
          npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the production site
        run: npm run build
        env:
          SITE_URL: ${{ steps.site.outputs.url }}

      - name: Verify the static output
        run: npm run verify
        env:
          SITE_URL: ${{ steps.site.outputs.url }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests against the production build
        run: npm run test:e2e
        env:
          SITE_URL: ${{ steps.site.outputs.url }}

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
